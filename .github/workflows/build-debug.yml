name: Build Debug APKs

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build OpenEUICC Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build EasyEUICC Debug APK
        run: ./gradlew --no-daemon :app-unpriv:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p artifacts

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/OpenEUICC-debug.apk
          fi

          if [ -f app-unpriv/build/outputs/apk/debug/app-unpriv-debug.apk ]; then
            cp app-unpriv/build/outputs/apk/debug/app-unpriv-debug.apk artifacts/EasyEUICC-debug.apk
          fi

          echo "Generated APKs:"
          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APKs
          path: artifacts/*.apk
          if-no-files-found: error
