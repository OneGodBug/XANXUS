name: Build Debug APKs

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --list | head -50
          ls -la "$ANDROID_HOME/platforms/android-35"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p artifacts

          find . -name "app-debug.apk" -type f \
            -exec cp {} artifacts/OpenEUICC-debug.apk \;

          find . -name "app-unpriv-debug.apk" -type f \
            -exec cp {} artifacts/EasyEUICC-debug.apk \;

          echo "Generated APKs:"
          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APKs
          path: artifacts/*.apk
          if-no-files-found: error
