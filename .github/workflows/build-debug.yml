name: Build Debug APKs

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Copy APKs
        run: |
          mkdir -p artifacts
          find . -path "*/build/outputs/apk/debug/*.apk" -type f -exec cp {} artifacts/ \;

      - name: List APKs
        run: |
          echo "Built APKs:"
          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APKs
          path: artifacts/*.apk
          if-no-files-found: error
