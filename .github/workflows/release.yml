name: Build Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Build EasyEUICC Release
    runs-on: ubuntu-24.04

    steps:
      # 1. 拉取源代码和所有 submodule
      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 安装 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 安装 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. 恢复 Release 签名配置
      - name: Restore Signing Configuration
        shell: bash
        env:
          SIGNING_CONFIG: ${{ secrets.OPENEUICC_SIGNING_CONFIG }}
        run: |
          if [ -z "$SIGNING_CONFIG" ]; then
            echo "ERROR: OPENEUICC_SIGNING_CONFIG is not configured."
            exit 1
          fi

          echo "$SIGNING_CONFIG" | base64 --decode > "$GITHUB_WORKSPACE/keystore.properties"

          echo "keystore.properties restored."

      # 5. 检查 Gradle
      - name: Grant Gradle Execute Permission
        run: chmod +x ./gradlew

      # 6. 运行测试
      - name: Run Tests
        run: ./gradlew --no-daemon test

      # 7. 编译 EasyEUICC Release
      - name: Build EasyEUICC Release
        run: ./gradlew --no-daemon :app-unpriv:assembleRelease

      # 8. 检查 APK 输出
      - name: List Release Files
        run: |
          echo "Release output:"
          find app-unpriv/build/outputs/apk/release -maxdepth 1 -type f -print

      # 9. 复制 Native Debug Symbols
      - name: Copy Debug Symbols
        run: |
          SYMBOLS="app-unpriv/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          OUTPUT="app-unpriv/build/outputs/apk/release"

          if [ -f "$SYMBOLS" ]; then
            cp "$SYMBOLS" "$OUTPUT/"
            echo "Native debug symbols copied."
          else
            echo "No native debug symbols found."
          fi

      # 10. 创建 GitHub Release 并上传 APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            app-unpriv/build/outputs/apk/release/*
