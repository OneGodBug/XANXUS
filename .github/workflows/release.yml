name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
      - '*v*'
  workflow_dispatch: # 支持在 GitHub 界面上手动触发

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Android Keystore & Secret Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android-keystore.jks
            echo "$KEYSTORE_PROPERTIES" > keystore.properties
          else
            echo "Warning: No KEYSTORE_BASE64 provided. Falling back to unsigned / debug build settings if applicable."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build EasyEUICC Release APK (Unprivileged)
        run: ./gradlew :app-unpriv:assembleRelease

      - name: Build OpenEUICC Release APK (Privileged)
        run: ./gradlew :app:assembleRelease
        continue-on-error: true # 如果没有配置 privileged 秘钥，允许跳过或降级

      - name: Collect Output Files
        run: |
          mkdir -p output/
          
          # 复制 EasyEUICC APK
          find app-unpriv/build/outputs/apk/release/ -name "*.apk" -exec cp {} output/EasyEUICC-release.apk \; 2>/dev/null || true
          
          # 复制 OpenEUICC APK
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output/OpenEUICC-release.apk \; 2>/dev/null || true

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
