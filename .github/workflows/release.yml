name: Build Release

on:
  workflow_dispatch:

  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Build EasyEUICC Unsigned Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Disable Signing Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app-unpriv/build.gradle.kts")
          text = path.read_text()

          text = text.replace(
              'plugin<MySigningPlugin>()',
              '// plugin<MySigningPlugin>()'
          )

          text = text.replace(
              '''signingKeystoreProperties {
              keyAliasField = "unprivKeyAlias"
              keyPasswordField = "unprivKeyPassword"
          }

          ''',
              ''
          )

          path.write_text(text)
          PY

          echo "Signing plugin disabled for CI build."

      - name: Grant Gradle Execute Permission
        run: chmod +x ./gradlew

      - name: Build EasyEUICC Unsigned Release
        run: ./gradlew --no-daemon :app-unpriv:assembleRelease

      - name: Find APK
        id: apk
        run: |
          APK=$(find app-unpriv/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Prepare APK
        run: |
          mkdir -p release

          cp "${{ steps.apk.outputs.APK }}" \
            "release/EasyEUICC-${{ github.ref_name }}-unsigned.apk"

          SYMBOLS="app-unpriv/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"

          if [ -f "$SYMBOLS" ]; then
            cp "$SYMBOLS" release/
          fi

          ls -lh release/

      # Tag 构建：自动创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/*

      # 手动运行：把 APK 保存为 Actions Artifact
      - name: Upload APK Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: EasyEUICC-${{ github.run_number }}-unsigned
          path: release/*
          retention-days: 7
